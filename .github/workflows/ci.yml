# Nom du workflow
name: CI

# Déclencheurs 
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, main]

# Jobs (etapes du pipeline)
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run python -c "import src.main"

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t api-projet-5-oc .
      - run: docker run -d -p 8000:8000 --name projet_5_oc_api api-projet-5-oc
      - run: curl --fail http://localhost:8000/health --retry 5 --retry-connrefused

